<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — ICQ Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chat: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            accent: '#6366f1',
                            sent: '#334155',
                            received: '#1e3a5f',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .messages-scroll::-webkit-scrollbar { width: 6px; }
        .messages-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-chat-bg text-slate-100 min-h-screen">

<!-- Login Screen -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-chat-panel rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-chat-accent rounded-2xl mx-auto flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Chat</h1>
            <p class="text-slate-400 mt-1">Введите логин для входа</p>
        </div>
        <form id="login-form" class="space-y-4">
            <input type="text" id="username-input" placeholder="Логин"
                   class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-chat-accent focus:ring-1 focus:ring-chat-accent"
                   autocomplete="off" autofocus>
            <button type="submit"
                    class="w-full py-3 bg-chat-accent hover:bg-indigo-500 text-white font-semibold rounded-xl transition-colors">
                Войти
            </button>
        </form>
        <p id="login-error" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen" class="hidden h-screen flex">
    <!-- Sidebar -->
    <aside class="w-80 bg-chat-panel border-r border-slate-700 flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 uppercase tracking-wide">Вы вошли как</p>
                    <p id="current-username" class="font-semibold text-white text-lg"></p>
                </div>
                <button id="logout-btn" class="text-slate-400 hover:text-white text-sm px-2 py-1 rounded hover:bg-slate-700">
                    Выйти
                </button>
            </div>
            <div id="ws-status" class="mt-2 flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-yellow-400" id="ws-dot"></span>
                <span id="ws-label" class="text-slate-400">Подключение...</span>
            </div>
        </div>
        <div class="p-3">
            <p class="text-xs text-slate-500 uppercase tracking-wide mb-2 px-1">Пользователи</p>
        </div>
        <ul id="users-list" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1"></ul>
    </aside>

    <!-- Chat Area -->
    <main class="flex-1 flex flex-col bg-chat-bg">
        <div id="no-chat-selected" class="flex-1 flex items-center justify-center text-slate-500">
            <div class="text-center">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <p>Выберите собеседника</p>
            </div>
        </div>

        <div id="chat-area" class="hidden flex-1 flex flex-col">
            <header class="px-6 py-4 bg-chat-panel border-b border-slate-700 flex items-center gap-3">
                <div class="w-10 h-10 bg-chat-accent rounded-full flex items-center justify-center font-bold text-white" id="peer-avatar"></div>
                <div>
                    <p id="peer-name" class="font-semibold text-white"></p>
                    <p id="peer-status" class="text-xs text-slate-400">offline</p>
                </div>
            </header>

            <div id="messages-container" class="flex-1 overflow-y-auto messages-scroll p-6 space-y-3"></div>

            <footer class="p-4 bg-chat-panel border-t border-slate-700">
                <form id="message-form" class="flex gap-3">
                    <input type="text" id="message-input" placeholder="Сообщение..."
                           class="flex-1 px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-chat-accent"
                           autocomplete="off">
                    <button type="submit"
                            class="px-6 py-3 bg-chat-accent hover:bg-indigo-500 text-white font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
    </main>
</div>

<script>
    let currentUser = null;
    let selectedPeer = null;
    let ws = null;
    const messages = new Map();

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username-input');
    const loginError = document.getElementById('login-error');
    const currentUsernameEl = document.getElementById('current-username');
    const usersList = document.getElementById('users-list');
    const noChatSelected = document.getElementById('no-chat-selected');
    const chatArea = document.getElementById('chat-area');
    const peerName = document.getElementById('peer-name');
    const peerStatus = document.getElementById('peer-status');
    const peerAvatar = document.getElementById('peer-avatar');
    const messagesContainer = document.getElementById('messages-container');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const wsDot = document.getElementById('ws-dot');
    const wsLabel = document.getElementById('ws-label');
    const logoutBtn = document.getElementById('logout-btn');

    function conversationKey(a, b) {
        return [a, b].sort().join(':');
    }

    function getStatusIcon(status, isMine) {
        if (!isMine) return '';
        if (status === 'SENT') return '<span class="text-slate-400 ml-1">✓</span>';
        if (status === 'DELIVERED') return '<span class="text-slate-400 ml-1">✓✓</span>';
        if (status === 'READ') return '<span class="text-blue-400 ml-1">✓✓</span>';
        return '';
    }

    function renderMessage(msg) {
        const isMine = msg.senderUsername === currentUser.username;
        const div = document.createElement('div');
        div.dataset.messageId = msg.id;
        div.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `max-w-xs lg:max-w-md px-4 py-2 rounded-2xl text-sm ${
            isMine ? 'bg-chat-accent text-white rounded-br-sm' : 'bg-chat-received text-slate-100 rounded-bl-sm'
        }`;
        bubble.innerHTML = `<span class="message-content">${msg.content}</span><span class="status-icon">${getStatusIcon(msg.status, isMine)}</span>`;

        div.appendChild(bubble);
        return div;
    }

    function appendMessage(msg) {
        const key = conversationKey(msg.senderUsername, msg.recipientUsername);
        if (!messages.has(key)) messages.set(key, []);
        const list = messages.get(key);
        const existing = list.find(m => m.id === msg.id);
        if (existing) {
            existing.status = msg.status;
            updateMessageStatus(msg.id, msg.status);
            return;
        }
        list.push(msg);
        if (selectedPeer && conversationKey(currentUser.username, selectedPeer) === key) {
            messagesContainer.appendChild(renderMessage(msg));
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    function updateMessageStatus(messageId, status) {
        const el = messagesContainer.querySelector(`[data-message-id="${messageId}"]`);
        if (!el) return;
        const iconEl = el.querySelector('.status-icon');
        if (iconEl) {
            const msg = findMessageById(messageId);
            if (msg) iconEl.innerHTML = getStatusIcon(status, msg.senderUsername === currentUser.username);
        }
    }

    function findMessageById(id) {
        for (const list of messages.values()) {
            const found = list.find(m => m.id === id);
            if (found) return found;
        }
        return null;
    }

    function renderMessages(peer) {
        messagesContainer.innerHTML = '';
        const key = conversationKey(currentUser.username, peer);
        const list = messages.get(key) || [];
        list.forEach(msg => messagesContainer.appendChild(renderMessage(msg)));
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadUsers() {
        const res = await fetch(`/api/users?username=${encodeURIComponent(currentUser.username)}`);
        const users = await res.json();
        usersList.innerHTML = '';
        users.forEach(user => {
            const li = document.createElement('li');
            li.dataset.username = user.username;
            li.className = 'flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer hover:bg-slate-700 transition-colors user-item';
            li.innerHTML = `
                <div class="relative">
                    <div class="w-9 h-9 bg-slate-600 rounded-full flex items-center justify-center text-sm font-bold">${user.username[0].toUpperCase()}</div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-chat-panel ${user.online ? 'bg-green-400' : 'bg-slate-500'}"></span>
                </div>
                <span class="font-medium text-slate-200">${user.username}</span>
            `;
            li.addEventListener('click', () => selectPeer(user.username, user.online));
            usersList.appendChild(li);
        });
    }

    async function loadHistory(peer) {
        const res = await fetch(`/api/messages?username=${encodeURIComponent(currentUser.username)}&peer=${encodeURIComponent(peer)}`);
        const history = await res.json();
        const key = conversationKey(currentUser.username, peer);
        messages.set(key, history);
        renderMessages(peer);
    }

    function selectPeer(username, online) {
        selectedPeer = username;
        noChatSelected.classList.add('hidden');
        chatArea.classList.remove('hidden');
        peerName.textContent = username;
        peerAvatar.textContent = username[0].toUpperCase();
        peerStatus.textContent = online ? 'online' : 'offline';
        peerStatus.className = `text-xs ${online ? 'text-green-400' : 'text-slate-400'}`;

        document.querySelectorAll('.user-item').forEach(el => {
            el.classList.toggle('bg-slate-700', el.dataset.username === username);
        });

        loadHistory(username).then(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'mark_read', peerUsername: username }));
            }
        });
        messageInput.focus();
    }

    function updateUserOnlineStatus(username, online) {
        const item = usersList.querySelector(`[data-username="${username}"]`);
        if (item) {
            const dot = item.querySelector('.rounded-full.border-2');
            if (dot) dot.className = `absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-chat-panel ${online ? 'bg-green-400' : 'bg-slate-500'}`;
        }
        if (selectedPeer === username) {
            peerStatus.textContent = online ? 'online' : 'offline';
            peerStatus.className = `text-xs ${online ? 'text-green-400' : 'text-slate-400'}`;
        }
    }

    let reconnectAttempts = 0;
    let reconnectTimer = null;

    function connectWebSocket() {
        if (!currentUser) return;

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws?username=${encodeURIComponent(currentUser.username)}`);

        ws.onopen = () => {
            reconnectAttempts = 0;
            wsDot.className = 'w-2 h-2 rounded-full bg-green-400';
            wsLabel.textContent = 'Подключено';
            loadUsers();
        };

        ws.onclose = () => {
            wsDot.className = 'w-2 h-2 rounded-full bg-yellow-400';
            wsLabel.textContent = 'Связь потеряна. Переподключение...';
            scheduleReconnect();
        };

        ws.onerror = (err) => {
            console.warn('WS error:', err);
            ws.close();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            switch (data.type) {
                case 'connected':
                    break;
                case 'message_sent':
                case 'new_message':
                    appendMessage(data.message);
                    break;
                case 'status_update':
                    const msg = findMessageById(data.messageId);
                    if (msg) msg.status = data.status;
                    updateMessageStatus(data.messageId, data.status);
                    break;
                case 'user_online':
                    updateUserOnlineStatus(data.username, true);
                    break;
                case 'user_offline':
                    updateUserOnlineStatus(data.username, false);
                    break;
                case 'error':
                    console.error('WS error:', data.message);
                    break;
            }
        };
    }

    function scheduleReconnect() {
        if (!currentUser || reconnectTimer) return;

        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
        reconnectAttempts++;

        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connectWebSocket();
        }, delay);
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        loginError.classList.add('hidden');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            if (!res.ok) throw new Error(await res.text());
            currentUser = await res.json();
            localStorage.setItem('chat_username', currentUser.username);

            loginScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            currentUsernameEl.textContent = currentUser.username;

            await loadUsers();
            connectWebSocket();
        } catch (err) {
            loginError.textContent = err.message || 'Ошибка входа';
            loginError.classList.remove('hidden');
        }
    });

    messageForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = messageInput.value.trim();
        if (!content || !selectedPeer || !ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(JSON.stringify({
            type: 'send_message',
            recipientUsername: selectedPeer,
            content
        }));
        messageInput.value = '';
    });

    logoutBtn.addEventListener('click', () => {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectAttempts = 0;
        if (ws) ws.close();
        currentUser = null;
        selectedPeer = null;
        messages.clear();
        localStorage.removeItem('chat_username');
        chatScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        usernameInput.value = '';
    });

    const saved = localStorage.getItem('chat_username');
    if (saved) usernameInput.value = saved;
</script>
</body>
</html>
